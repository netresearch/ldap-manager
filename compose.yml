# A fixed project name keeps volume and network names the same in every
# checkout, so that "make ldap-reset" finds the volumes it removes.
name: ldap-manager

services:
  # Creates a self-signed CA and server certificate for LDAPS on the first
  # start. osixia/openldap v2 does not generate certificates itself.
  openldap-certs:
    image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    entrypoint: /bin/sh
    command: /dev-certs.sh /certs
    volumes:
      - ./dev/dev-certs.sh:/dev-certs.sh:ro
      - openldap_certs:/certs
    profiles:
      - dev

  # OpenLDAP server for local development and testing
  openldap:
    image: osixia/openldap:2.6.15
    container_name: ldap-server
    hostname: ldap-server
    ports:
      - "389:389"
      - "636:636"
    environment:
      # slapd listens on the standard ports instead of the image's default
      # 3890/6360, so URLs inside and outside the container stay the same.
      # Docker lets the unprivileged ldap user bind them.
      OPENLDAP_URLS: "ldap://:389 ldaps://:636 ldapi:///"
      OPENLDAP_BOOTSTRAP_ORGANIZATION: "Netresearch"
      OPENLDAP_BOOTSTRAP_SUFFIX: "dc=netresearch,dc=local"
      # The *_HASHED variables take any userPassword value; a value without
      # {SCHEME} prefix would be stored as cleartext. The dev stack keeps
      # {SSHA} hashes. Plain values: cn=admin,dc=netresearch,dc=local
      # "admin", cn=admin,cn=config "config", cn=readonly,dc=netresearch,dc=local
      # "readonly". Regenerate one with:
      #   docker run --rm --entrypoint "" osixia/openldap:2.6.15 slappasswd -s <password> -h {SSHA}
      OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED: "{SSHA}ie005jVWs/hHw5vSI8025HxFKQpSBWSQ" # pragma: allowlist secret
      OPENLDAP_BOOTSTRAP_CONFIG_ROOT_PASSWORD_HASHED: "{SSHA}u6okyi2vA+zHWDbX13ioMRruxCwwHeNl" # pragma: allowlist secret
      OPENLDAP_BOOTSTRAP_DATA_READONLY: "true"
      OPENLDAP_BOOTSTRAP_DATA_READONLY_PASSWORD_HASHED: "{SSHA}etiSMYQzLehTg7Jv4YsEKHlAq9geXiza" # pragma: allowlist secret
      OPENLDAP_BOOTSTRAP_TLS: "true"
      OPENLDAP_BOOTSTRAP_TLS_VERIFY_CLIENT: "never"
      OPENLDAP_BOOTSTRAP_TLS_PROTOCOL_MIN: "3.3"
    volumes:
      # v2 bootstraps only into empty config and data directories, so these
      # volumes are not shared with the v1 ones (ldap_data, ldap_config).
      - openldap_data:/var/lib/openldap/openldap-data
      - openldap_config:/etc/openldap/slapd.d
      - openldap_certs:/container/services/openldap/assets/certs:ro
      - ./dev/seed.ldif:/container/services/openldap-bootstrap/assets/ldif/data/custom/seed.ldif:ro
    depends_on:
      openldap-certs:
        condition: service_completed_successfully
    networks:
      - ldap-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'ldapsearch -x -H ldap://localhost -b "dc=netresearch,dc=local" -D "cn=readonly,dc=netresearch,dc=local" -w readonly -LLL -s base dn'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - dev

  # Applies ACLs granting read access to all authenticated users (like AD default)
  openldap-init:
    image: osixia/openldap:2.6.15
    entrypoint: /bin/bash
    command: /setup-acl.sh ldap://ldap-server:389
    volumes:
      - ./dev/setup-acl.sh:/setup-acl.sh:ro
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - ldap-network
    profiles:
      - dev

  # phpLDAPadmin for LDAP management (optional)
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    hostname: phpldapadmin
    ports:
      - "8080:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "ldap-server"
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      - openldap
    networks:
      - ldap-network
    restart: unless-stopped
    profiles:
      - dev

  # Nginx TLS reverse proxy for local HTTPS development
  nginx:
    image: nginx:alpine
    ports:
      - "8443:443"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    # Proxies to the app run on the host with `make dev`, so local HTTPS works
    # against a live-reloading binary. host.docker.internal resolves to the
    # host through the gateway mapping below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ldap-network
    profiles:
      - dev

  # LDAP Manager application (production build)
  # Requires DOCKER_BUILDKIT=1 for cache mount optimizations
  ldap-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Build metadata - set via environment or leave empty for dev builds
        # Use proper ISO 8601 timestamp if set: BUILD_DATE=2024-01-01T00:00:00Z
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
    container_name: ldap-manager
    hostname: ldap-manager
    # Load environment variables from .env file
    env_file:
      - .env
    environment:
      # Cookie security (false for HTTP-only environments, true for HTTPS)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # Session settings
      PERSIST_SESSIONS: ${PERSIST_SESSIONS:-false}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production}

      # Application settings
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: ${PORT:-3000}

      # Environment type
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      # Persistent storage for BBolt session database
      - ldap_sessions:/data
      # Mount local CA certificates for LDAPS connections
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "3000:3000"
    networks:
      - ldap-network

volumes:
  # Persistent volumes for data storage
  openldap_data:
    driver: local
  openldap_config:
    driver: local
  openldap_certs:
    driver: local
  ldap_sessions:
    driver: local
  # Development volumes for caching
  go_modules:
    driver: local
  go_cache:
    driver: local

networks:
  ldap-network:
