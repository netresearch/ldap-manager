services:
  # OpenLDAP server for local development and testing
  openldap:
    image: osixia/openldap:1.5.0
    container_name: ldap-server
    hostname: ldap-server
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_LOG_LEVEL: "256"
      LDAP_ORGANISATION: "Netresearch"
      LDAP_DOMAIN: "netresearch.local"
      LDAP_BASE_DN: "dc=netresearch,dc=local"
      LDAP_ADMIN_PASSWORD: "admin" # pragma: allowlist secret
      LDAP_CONFIG_PASSWORD: "config" # pragma: allowlist secret
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonly" # pragma: allowlist secret
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_BACKEND: "mdb"
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_DH_PARAM_FILENAME: "dhparam.pem"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_ENFORCE: "false"
      LDAP_TLS_CIPHER_SUITE: "SECURE256:-VERS-SSL3.0"
      LDAP_TLS_PROTOCOL_MIN: "3.1"
      LDAP_TLS_VERIFY_CLIENT: "demand"
      LDAP_REPLICATION: "false"
      KEEP_EXISTING_CONFIG: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      LDAP_SSL_HELPER_PREFIX: "ldap"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./dev/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
    command: --copy-service
    networks:
      - ldap-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'ldapsearch -x -H ldap://localhost -b "$$LDAP_BASE_DN" -D "cn=admin,$$LDAP_BASE_DN" -w "$$LDAP_ADMIN_PASSWORD" -LLL'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - dev

  # Applies ACLs granting read access to all authenticated users (like AD default)
  openldap-init:
    image: osixia/openldap:1.5.0
    entrypoint: /bin/bash
    command: /setup-acl.sh ldap://ldap-server:389
    volumes:
      - ./dev/setup-acl.sh:/setup-acl.sh:ro
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - ldap-network
    profiles:
      - dev

  # phpLDAPadmin for LDAP management (optional)
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    hostname: phpldapadmin
    ports:
      - "8080:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "ldap-server"
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      - openldap
    networks:
      - ldap-network
    restart: unless-stopped
    profiles:
      - dev

  # Nginx TLS reverse proxy for local HTTPS development
  nginx:
    image: nginx:alpine
    ports:
      - "8443:443"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    # Proxies to the app run on the host with `make dev`, so local HTTPS works
    # against a live-reloading binary. host.docker.internal resolves to the
    # host through the gateway mapping below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ldap-network
    profiles:
      - dev

  # LDAP Manager application (production build)
  # Requires DOCKER_BUILDKIT=1 for cache mount optimizations
  ldap-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Build metadata - set via environment or leave empty for dev builds
        # Use proper ISO 8601 timestamp if set: BUILD_DATE=2024-01-01T00:00:00Z
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
    container_name: ldap-manager
    hostname: ldap-manager
    # Load environment variables from .env file
    env_file:
      - .env
    environment:
      # Cookie security (false for HTTP-only environments, true for HTTPS)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # Session settings
      PERSIST_SESSIONS: ${PERSIST_SESSIONS:-false}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production}

      # Application settings
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: ${PORT:-3000}

      # Environment type
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      # Persistent storage for BBolt session database
      - ldap_sessions:/data
      # Mount local CA certificates for LDAPS connections
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "3000:3000"
    networks:
      - ldap-network

volumes:
  # Persistent volumes for data storage
  ldap_data:
    driver: local
  ldap_config:
    driver: local
  ldap_sessions:
    driver: local
  # Development volumes for caching
  go_modules:
    driver: local
  go_cache:
    driver: local

networks:
  ldap-network:
