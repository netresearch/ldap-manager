# Gremlins Mutation Testing Configuration
# https://gremlins.dev/latest/usage/configuration/
#
# gremlins reads only the keys of its reference configuration: settings
# for "gremlins unleash" go under "unleash:", mutators under "mutants:".
# Unknown keys are ignored without a warning.

unleash:
  # Machine-readable report; the shared CI workflow uploads this file.
  output: mutation-report.json

  # Multiplier for the per-mutant test timeout.
  timeout-coefficient: 5

  # gremlins exits with code 10 when the efficacy is at or below this value.
  # The shared CI workflow reports the score and does not fail on it.
  threshold:
    efficacy: 60

  # Regular expressions matched against the path relative to the module
  # root. Test files (_test.go) are always excluded. gremlins mutates the
  # whole module, so the packages outside the core set (ldap_cache,
  # options, retry, version, web) are excluded here.
  exclude-files:
    - "^cmd/"
    - "^internal/integration/"
    - "^internal/ldap/"
    - "(^|/)test/" # Test helpers
    - "(^|/)mock/" # Mock implementations
    - "(^|/)generated/" # Generated code
    - "_templ\\.go$" # Generated templ files

mutants:
  arithmetic-base:
    enabled: false
  conditionals-boundary:
    enabled: true # < to <=, > to >=
  conditionals-negation:
    enabled: true # == to !=
  increment-decrement:
    enabled: true # ++ to --
  invert-logical:
    enabled: true # && to ||
  invert-negatives:
    enabled: true # -x to x
  invert-loopctrl:
    enabled: true # break to continue
